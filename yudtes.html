<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הזמנות י״ט בכסלו • כפר רתמים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e9;--surface:#fff;--surface-2:#fdf0d5;--ink:#2b2118;--muted:#74665a;--line:#ecd9b8;--primary:#8a3f1d;--gold:#c08a2d;--green:#16794e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Heebo,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
.container{max-width:980px;margin:0 auto;padding:12px 12px 48px}
header{border-radius:22px;border:1px solid var(--line);background:var(--surface);overflow:hidden;margin-bottom:14px}
.banner{background:linear-gradient(135deg,#8a3f1d,#c08a2d,#8a3f1d);color:#fff;padding:28px 20px;text-align:center}
.banner .lbl{font-size:13px;font-weight:700;color:#f5d78a;margin-bottom:6px}
.banner h1{font-family:"Frank Ruhl Libre",serif;font-size:clamp(26px,7vw,40px);font-weight:700}
.inner{padding:16px 20px 20px}
.muted{color:var(--muted)}
.tip{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat .num{font-size:clamp(22px,6vw,30px);font-weight:800}
.stat .lbl{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);font:inherit;font-size:15px;margin-bottom:10px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.filters button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.filters button.active{background:var(--primary);border-color:var(--primary);color:#fff}
.count{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
.cards{display:grid;gap:12px}
@media(min-width:720px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{font-size:18px;font-weight:800}
.meta{font-size:13px;color:var(--muted);margin-top:4px}
.note{margin-top:8px;background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:600;color:var(--muted)}
.org-warn{margin-top:8px;background:#fff8e6;border-radius:8px;padding:8px;font-size:12px;font-weight:700;color:#7a4a00}
.phone{margin-top:8px;font-size:14px;font-weight:600}
.msg{margin-top:10px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.msg-full{margin-top:6px;font-size:13px}
.msg-full summary{color:var(--primary);font-weight:700;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 12px;border-radius:12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.btn-wa{background:var(--green);border-color:var(--green);color:#fff;flex:1 1 100%;font-size:15px;font-weight:800}
.btn-native{flex:1;font-size:12px}
.btn-disabled{flex:1;background:var(--surface-2);color:var(--muted)}
.btn-copy{flex:1}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:100;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.loading{text-align:center;padding:40px;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div class="container">
<header>
<div class="banner"><div class="lbl">כפר רתמים • י״ט בכסלו</div><h1>הזמנות אישיות להתוועדות</h1></div>
<div class="inner">
<p class="muted" style="font-size:15px">יום ראשון, 29.11.2026 • 21:00 • בבית משפחת רייניץ, כפר רתמים</p>
<div class="tip"><strong>לחצו על הכפתור הירוק</strong> כדי לפתוח ישירות בוואטסאפ עם ההודעה האישית.</div>
</div>
</header>
<div class="stats" id="stats"></div>
<input class="search" id="search" type="search" placeholder="חיפוש לפי שם או טלפון…">
<div class="filters" id="filters"></div>
<p class="count" id="count"></p>
<div class="cards" id="cards"><p class="loading">טוען אנשי קשר…</p></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
var EVENT_DATE="יום ראשון, 29.11.2026, י״ט בכסלו";
var EVENT_TIME="21:00";
var LOCATION="בבית משפחת רייניץ, כפר רתמים";
var TEMPLATE="שלום [שם] היקר!\n\nרציתי להזמין אותך באופן אישי להצטרף אלינו להתוועדות חגיגית לכבוד י״ט בכסלו, חג הגאולה של האדמו״ר הזקן בעל התניא וראש השנה לחסידות.\n\nההתוועדות תתקיים ב[תאריך], בשעה [שעה], ב[מיקום].\n\nנשמח מאוד לראות אותך איתנו, להתוועד יחד, לשמוע דברי חסידות, כיבוד עשיר, לחיים ולברכה!\n\nמקווים לראותך!\nבהערכה ובאהבה ❤️";
var contacts=[],filter="all",search="";
var toast=document.getElementById("toast");
function esc(s){return String(s).replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">").replace(/"/g,""");}
function genderLabel(g){return g==="male"?"גבר":g==="female"?"אישה":g==="org"?"ארגון / שירות":"לא ידוע";}
function buildMsg(c){var first=c.first||(c.name||"").split(/\s+/)[0]||c.name;var msg=TEMPLATE.replaceAll("[שם]",first).replaceAll("[תאריך]",EVENT_DATE).replaceAll("[שעה]",EVENT_TIME).replaceAll("[מיקום]",LOCATION);if(c.gender==="female")msg=msg.replace(/היקר(?!ה)/g,"היקרה");if(c.gender==="male")msg=msg.replaceAll("היקרה","היקר");return msg;}
function showToast(t){toast.textContent=t;toast.classList.add("show");setTimeout(function(){toast.classList.remove("show");},2000);}
function render(){var male=0,female=0,unknown=0,org=0,review=0,nophone=0;contacts.forEach(function(c){if(c.gender==="male")male++;else if(c.gender==="female")female++;else if(c.gender==="org")org++;else unknown++;if(c.note)review++;if(!c.phone)nophone++;});document.getElementById("stats").innerHTML='<div class="stat"><div class="num">'+male+'</div><div class="lbl">גברים</div></div><div class="stat"><div class="num">'+female+'</div><div class="lbl">נשים</div></div><div class="stat"><div class="num">'+unknown+'</div><div class="lbl">לא ידוע</div></div>';var tabs=[["all","הכול",contacts.length],["male","גברים",male],["female","נשים",female],["unknown","לא ידוע",unknown],["org","ארגונים",org],["review","לבדיקה",review],["no-phone","בלי טלפון",nophone]];document.getElementById("filters").innerHTML=tabs.map(function(t){return '<button type="button" data-f="'+t[0]+'" class="'+(filter===t[0]?"active":"")+'">'+t[1]+" · "+t[2]+"</button>";}).join("");var q=search.trim().toLowerCase();var html="",shown=0;contacts.forEach(function(c){var g=c.gender||"unknown";var first=c.first||(c.name||"").split(/\s+/)[0]||c.name;var ok=true;if(filter==="male"&&g!=="male")ok=false;if(filter==="female"&&g!=="female")ok=false;if(filter==="unknown"&&g!=="unknown")ok=false;if(filter==="org"&&g!=="org")ok=false;if(filter==="review"&&!c.note)ok=false;if(filter==="no-phone"&&c.phone)ok=false;if(q){var hay=((c.name||"")+" "+first+" "+(c.phoneRaw||"")+" "+(c.phone||"")+" "+(c.note||"")).toLowerCase();if(hay.indexOf(q)===-1)ok=false;}if(!ok)return;shown++;var msg=buildMsg(c);var short=msg.length>220?msg.slice(0,220)+"…":msg;var wa="";if(c.phone&&g!=="org"){var url="https://wa.me/"+c.phone+"?text="+encodeURIComponent(msg);var native="whatsapp://send?phone="+c.phone+"&text="+encodeURIComponent(msg);wa='<a class="btn btn-wa" href="'+esc(url)+'">📱 פתח בוואטסאפ</a><a class="btn btn-native" href="'+esc(native)+'">פתיחה ישירה</a>';}else{wa='<span class="btn btn-disabled">'+(c.phone?"לא לשליחה אישית":"אין טלפון")+'</span>';}html+='<article class="card"><h2>'+esc(c.name)+'</h2><p class="meta">שם פרטי: <strong>'+esc(first)+'</strong> • '+genderLabel(g)+'</p>'+(c.note?'<p class="note">לבדיקה: '+esc(c.note)+'</p>':'')+(g==="org"?'<p class="org-warn">ארגון / שירות — לא לשלוח הודעה אישית.</p>':'')+'<p class="phone" dir="ltr">'+esc(c.phoneRaw||"אין טלפון")+'</p><div class="msg">'+esc(short)+'</div>'+(msg.length>220?'<details class="msg-full"><summary>הצג הודעה מלאה</summary><div class="msg">'+esc(msg)+'</div></details>':'')+'<div class="actions">'+wa+'<button type="button" class="btn btn-copy" data-msg="'+esc(msg)+'">העתק הודעה</button></div></article>';});document.getElementById("count").textContent="מציגים "+shown+" מתוך "+contacts.length+" אנשי קשר";document.getElementById("cards").innerHTML=html||'<p class="loading">אין תוצאות.</p>';}
document.getElementById("filters").addEventListener("click",function(e){var btn=e.target.closest("[data-f]");if(!btn)return;filter=btn.getAttribute("data-f");render();});
document.getElementById("search").addEventListener("input",function(e){search=e.target.value;render();});
document.getElementById("cards").addEventListener("click",function(e){var btn=e.target.closest(".btn-copy");if(!btn)return;var msg=btn.getAttribute("data-msg")||"";if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(msg).then(function(){showToast("ההודעה הועתקה");}).catch(fallback);}else fallback();function fallback(){var ta=document.createElement("textarea");ta.value=msg;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");showToast("ההודעה הועתקה");}catch(err){}document.body.removeChild(ta);}});
function b64ToBytes(b64){var bin=atob(b64);var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return bytes;}
async function loadContacts(){try{var parts=await Promise.all([fetch("contacts.b64.0").then(function(r){return r.text();}),fetch("contacts.b64.1").then(function(r){return r.text();}),fetch("contacts.b64.2").then(function(r){return r.text();}),fetch("contacts.b64.3").then(function(r){return r.text();})]);var b64=(parts[0]+parts[1]+parts[2]+parts[3]).replace(/\s/g,"");var bytes=b64ToBytes(b64);var ds=new DecompressionStream("gzip");var stream=new Blob([bytes]).stream().pipeThrough(ds);var text=await new Response(stream).text();contacts=JSON.parse(text);render();}catch(e){document.getElementById("cards").innerHTML='<p class="loading">שגיאה בטעינה</p>';console.error(e);}}
loadContacts();
})();
</script>
</body>
</html>
